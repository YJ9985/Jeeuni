name: Backend CD - Build, Push, Deploy, Migrate

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_BACKEND_REPO: 948638133962.dkr.ecr.ap-northeast-2.amazonaws.com/jeeuni-backend

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::948638133962:role/GitHubActions-ECR-ECS
          role-session-name: github-actions-jeeuni
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        run: |
          set -euo pipefail
          BACKEND_TAG_SHA=${ECR_BACKEND_REPO}:${GITHUB_SHA}
          BACKEND_TAG_LATEST=${ECR_BACKEND_REPO}:latest
          
          docker build -t "$BACKEND_TAG_SHA" -t "$BACKEND_TAG_LATEST" ./backend
          docker push "$BACKEND_TAG_SHA"
          docker push "$BACKEND_TAG_LATEST"

      # 1) Task Definition 업데이트 + Service 배포
      - name: Deploy backend to ECS (update task definition & service)
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}                 
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}                 
          TASK_DEFINITION_FAMILY: ${{ secrets.TASK_DEFINITION_FAMILY }}  
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}          
          NEW_IMAGE: ${{ env.ECR_BACKEND_REPO }}:${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Deploying image: ${NEW_IMAGE}"

          # 현재 Task Definition 가져오기
          aws ecs describe-task-definition \
            --task-definition "${TASK_DEFINITION_FAMILY}" \
            --query "taskDefinition" \
            --output json > taskdef.json

          # 파이썬 스크립트로 이미지 URL 교체 및 불필요한 필드 삭제
          python - << 'PY'
          import json, os
          td = json.load(open("taskdef.json", "r", encoding="utf-8"))

          # AWS에서 자동 생성하는 읽기 전용 필드 제거 (재등록 시 에러 방지)
          for k in ["taskDefinitionArn","revision","status","requiresAttributes","compatibilities","registeredAt","registeredBy"]:
              td.pop(k, None)

          cname = os.environ["CONTAINER_NAME"]
          new_image = os.environ["NEW_IMAGE"]

          updated = False
          for c in td.get("containerDefinitions", []):
              if c.get("name") == cname:
                  c["image"] = new_image
                  updated = True
          if not updated:
              raise SystemExit(f"Container name '{cname}' not found in task definition.")

          json.dump(td, open("taskdef.rendered.json", "w", encoding="utf-8"), indent=2)
          print("Rendered taskdef.rendered.json with image:", new_image)
          PY

          # 새로운 Task Definition 등록
          NEW_TD_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://taskdef.rendered.json \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)

          echo "NEW_TD_ARN=${NEW_TD_ARN}" >> $GITHUB_ENV
          echo "New task definition ARN: ${NEW_TD_ARN}"

          # 서비스 업데이트 (강제 새 배포)
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${NEW_TD_ARN}" \
            --force-new-deployment

          # 배포 안정화 대기 (Health Check 통과할 때까지 대기)
          echo "Waiting for service to stabilize..."
          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}"

      # 2) 배포된 "같은 revision"으로 migrate 수행 (옵션 A)
      - name: Run Django migrate as one-off ECS task
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
          # 중요: 아래 서브넷/보안그룹 ID가 실제 AWS 환경과 일치해야 합니다.
          SUBNETS: "subnet-02ca4f4158a0652dc,subnet-08f6ade2d76d8e338,subnet-04a29d2f7345b1f7a,subnet-01bf4d1f56c9a6c65"
          SECURITY_GROUPS: "sg-0cbcb920332f95bf9"
        run: |
          set -euo pipefail
          echo "Running migrate on ECS one-off task..."
          
          # JSON 포맷 에러 방지를 위해 변수로 분리
          NET_CONFIG="awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SECURITY_GROUPS}],assignPublicIp=ENABLED}"
          OVERRIDES="{\"containerOverrides\":[{\"name\":\"${CONTAINER_NAME}\",\"command\":[\"python\",\"manage.py\",\"migrate\",\"--noinput\"]}]}"

          TASK_ARN=$(aws ecs run-task \
            --cluster "${ECS_CLUSTER}" \
            --launch-type FARGATE \
            --task-definition "${NEW_TD_ARN}" \
            --count 1 \
            --network-configuration "${NET_CONFIG}" \
            --overrides "${OVERRIDES}" \
            --query "tasks[0].taskArn" \
            --output text)

          echo "Migrate task ARN: ${TASK_ARN}"
          
          # 태스크가 끝날 때까지 대기
          aws ecs wait tasks-stopped --cluster "${ECS_CLUSTER}" --tasks "${TASK_ARN}"

          # 종료 코드 확인 (0이면 성공, 아니면 실패)
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "${ECS_CLUSTER}" \
            --tasks "${TASK_ARN}" \
            --query "tasks[0].containers[?name=='${CONTAINER_NAME}'].exitCode | [0]" \
            --output text)

          echo "Migrate exit code: ${EXIT_CODE}"

          if [ "${EXIT_CODE}" != "0" ]; then
            echo "Migrate failed. Dumping task details:"
            aws ecs describe-tasks --cluster "${ECS_CLUSTER}" --tasks "${TASK_ARN}"
            exit 1
          fi

          echo "Migrate succeeded."