name: Frontend CD - Build & Deploy to S3/CloudFront

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'  # frontend 폴더가 바뀔 때만 실행 (프로젝트 구조에 맞게 수정 가능)
      - '.github/workflows/deploy-frontend.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Node.js 설치
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/vue-project/package-lock.json'

      # 2. 의존성 설치
      - name: Install dependencies
        working-directory: ./frontend/vue-project
        run: |
          npm ci

      # 3. 빌드 (백엔드 주소 연결)
      - name: Build
        env:
          VITE_API_URL: "http://jeeuni-alb-890381289.ap-northeast-2.elb.amazonaws.com"
        run: |
          cd frontend
          npm run build

      # 4. AWS 권한 가져오기 (백엔드 때 썼던 역할 재사용)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::948638133962:role/GitHubActions-ECR-ECS
          role-session-name: github-actions-frontend
          aws-region: ap-northeast-2

      # 5. S3에 파일 업로드 (기존 것 지우고 새 것 업로드)
      - name: Deploy to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          aws s3 sync ./frontend/dist s3://$S3_BUCKET --delete

      # 6. CloudFront 캐시 삭제 (사용자가 즉시 새 버전 보게 함)
      - name: Invalidate CloudFront Cache
        env:
          CLOUDFRONT_ID: ${{ secrets.CLOUDFRONT_DIST_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_ID \
            --paths "/*"