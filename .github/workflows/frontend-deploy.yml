name: Frontend CD - Build & Deploy to S3/CloudFront

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Node.js 설치
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/vue-project/package-lock.json'

      # 2. 의존성 설치
      - name: Install dependencies
        working-directory: ./frontend/vue-project
        run: |
          npm ci

      # 3. 빌드
      - name: Build
        env:
          VITE_API_BASE_URL: "http://jeeuni-alb-890381289.ap-northeast-2.elb.amazonaws.com"
          VITE_APP_KAKAO_CLIENT_ID: ${{ secrets.VITE_APP_KAKAO_CLIENT_ID }}
          VITE_APP_GOOGLE_CLIENT_ID: ${{ secrets.VITE_APP_GOOGLE_CLIENT_ID }}
        working-directory: ./frontend/vue-project
        run: npm run build

      # 4. AWS 권한 가져오기
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::948638133962:role/GitHubActions-ECR-ECS
          role-session-name: github-actions-frontend
          aws-region: ap-northeast-2

      # 5. S3에 파일 업로드
      - name: Deploy to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: aws s3 sync ./frontend/vue-project/dist s3://$S3_BUCKET --delete

      # 6. CloudFront 캐시 삭제
      - name: Invalidate CloudFront Cache
        env:
          CLOUDFRONT_ID: ${{ secrets.CLOUDFRONT_DIST_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_ID \
            --paths "/*"