name: CI - Build & Push Docker images to ECR

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2

  ECR_BACKEND_REPO: 948638133962.dkr.ecr.ap-northeast-2.amazonaws.com/jeeuni-backend
  ECR_FRONTEND_REPO: 948638133962.dkr.ecr.ap-northeast-2.amazonaws.com/jeeuni-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1) GitHub OIDC 토큰으로 IAM Role Assume
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::948638133962:role/GitHubActions-ECR-ECS
          role-session-name: github-actions-jeeuni
          aws-region: ${{ env.AWS_REGION }}

      # 2) ECR 로그인 (Docker login)
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 3) Backend 이미지 빌드 & 푸시
      - name: Build and push backend image
        run: |
          BACKEND_TAG_SHA=${ECR_BACKEND_REPO}:${GITHUB_SHA}
          BACKEND_TAG_LATEST=${ECR_BACKEND_REPO}:latest

          docker build \
            -t $BACKEND_TAG_SHA \
            -t $BACKEND_TAG_LATEST \
            ./backend

          docker push $BACKEND_TAG_SHA
          docker push $BACKEND_TAG_LATEST

        # 3-1) ECS Task Definition 업데이트 & 서비스 배포 (Backend)
      - name: Deploy backend to ECS (update task definition & service)
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
          TASK_DEFINITION_FAMILY: ${{ secrets.TASK_DEFINITION_FAMILY }}
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
          NEW_IMAGE: ${{ env.ECR_BACKEND_REPO }}:${{ github.sha }}
        run: |
          set -euo pipefail

          echo "Deploying image: ${NEW_IMAGE}"

          aws ecs describe-task-definition \
            --task-definition "${TASK_DEFINITION_FAMILY}" \
            --query "taskDefinition" \
            --output json > taskdef.json

          python - << 'PY'
          import json, os

          td = json.load(open("taskdef.json", "r", encoding="utf-8"))

          for k in ["taskDefinitionArn","revision","status","requiresAttributes","compatibilities","registeredAt","registeredBy"]:
              td.pop(k, None)

          cname = os.environ["CONTAINER_NAME"]
          new_image = os.environ["NEW_IMAGE"]

          updated = False
          for c in td.get("containerDefinitions", []):
              if c.get("name") == cname:
                  c["image"] = new_image
                  updated = True

          if not updated:
              raise SystemExit(f"Container name '{cname}' not found in task definition.")

          json.dump(td, open("taskdef.rendered.json", "w", encoding="utf-8"), indent=2)
          print("Rendered taskdef.rendered.json with image:", new_image)
          PY

      # 4) Frontend 이미지 빌드 & 푸시
      - name: Build and push frontend image
        run: |
          FRONTEND_TAG_SHA=${ECR_FRONTEND_REPO}:${GITHUB_SHA}
          FRONTEND_TAG_LATEST=${ECR_FRONTEND_REPO}:latest

          docker build \
            -t $FRONTEND_TAG_SHA \
            -t $FRONTEND_TAG_LATEST \
            ./frontend

          docker push $FRONTEND_TAG_SHA
          docker push $FRONTEND_TAG_LATEST